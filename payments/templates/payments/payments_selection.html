{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Payment Method</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
{#    <link rel="stylesheet" href="{% static 'styles.css' %}">#}
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f9;
            color: #333;
        }
        .navbar {
            background-color: lightskyblue; /* Navy blue */
            position: sticky;
            top: 0;
            z-index: 1000;
            color: black;
        }
        .navbar-brand, .nav-link {
            color: black !important;
        }
        .nav-link:hover {
            color: goldenrod !important; /* Gold on hover */
        }

        h2 {
            text-align: center;
            margin-bottom: 30px;
        }

        .payment-methods {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        form {
            margin: 10px 0;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #45a049; /* Darker green when hovering */
        }

        @media (min-width: 600px) {
            .payment-methods {
                width: 300px; /* Fixed width for forms */
            }
        }
    </style>
</head>
<body>

<header>
    <nav class="navbar navbar-expand-lg" style="font-size: 25px; color: black">
        <div class="container">
            <a class="navbar-brand" href="#">G MOTIONS</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'home_view' %}">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'about' %}">About</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'products_listing' %}">Marketplace</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'cars_list' %}">Showroom</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'garage_list' %}">Garage</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
</header>

<h2>Select Payment Method</h2>
<div class="payment-methods">
    <form action="{% url 'pay_on_delivery' %}" method="GET">
        <button type="submit">Pay on Delivery</button>
    </form>
    <form action="{% url 'mpesa_payment' %}" method="GET">
        <button type="submit">MPESA</button>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</body>
</html>
