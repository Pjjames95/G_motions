{% load static %}  
<!DOCTYPE html>  
<html lang="en">  
<head>  
    <meta charset="UTF-8">  
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Ensures responsiveness -->  
    <title>Sign Up - G MOTIONS</title>  
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">  
    <link rel="stylesheet" href="{% static 'css/style.css' %}">  
    <style>  
        body {  
            background-color: #f8f9fa; /* Light gray background */  
            font-family: 'Roboto', sans-serif; /* Consistent font style */  
        }  
        .signup-container {  
            max-width: 400px;  
            margin: auto;  
            padding: 30px;  
            background: lavender; /* White background for the form */  
            border-radius: 10px;  
            box-shadow: 0 4px 8px rgba(0,0,0,0.1); /* Box shadow for depth */  
        }  
        .signup-container h2, h1 {  
            text-align: center;  
            margin-bottom: 20px;  
            color: #003366; /* Navy color for header */  
        }  
        .signup-container .btn-primary {  
            width: 100%; /* Full-width button */  
        }  
        .signup-container p {  
            text-align: center; /* Centered text for links */  
        }  
        .show-password {  
            float: right;  
            margin-top: -30px;  
            margin-right: 10px;  
            cursor: pointer;  
        }  
        .social-links a {  
            color: white; /* Social links color */  
            margin: 0 10px;  
            text-decoration: none;  
        }  
        footer {  
            text-align: center;  
            padding: 20px 0;  
            background-color: rgba(0,0,0,0.9);   
            color: white;   
            border-radius: 10px;  
        }  
    </style>  
</head>  
<body>  
<div class="container mt-5">  
    <div class="signup-container">  
        <h1>G MOTIONS</h1>  
        <h2>Sign Up</h2>  
        <form method="post">  
            {% csrf_token %}  
            <div class="form-group mb-3">  
                <label for="id_username">Username</label>  
                <input type="text" name="username" class="form-control" id="id_username" required>  
            </div>  
            <div class="form-group mb-3">  
                <label for="id_email">Email</label>  
                <input type="email" name="email" class="form-control" id="id_email" required>  
            </div>  
            <div class="form-group mb-3">  
                <label for="id_password1">Password</label>  
                <input type="password" name="password1" class="form-control" id="id_password1" required>  
                <span class="show-password" onclick="togglePassword('id_password1')">Show</span>  
            </div>  
            <div class="form-group mb-3">  
                <label for="id_password2">Confirm Password</label>  
                <input type="password" name="password2" class="form-control" id="id_password2" required>  
                <span class="show-password" onclick="togglePassword('id_password2')">Show</span>  
            </div>  
            <div class="form-group form-check mb-3">  
                <input type="checkbox" class="form-check-input" id="terms" required>  
                <label class="form-check-label" for="terms">I agree to the Terms and Conditions</label>  
            </div>  
            <button type="submit" class="btn btn-primary mt-3">Sign Up</button>  
        </form>  
        <p class="mt-3">  
            Already have an account? <a href="{% url 'login' %}" class="btn btn-link">Log in</a>  
        </p>  
    </div>  
    <footer>  
        <div class="social-links">  
            <a href="https://facebook.com" target="_blank">Facebook</a>  
            <a href="https://twitter.com" target="_blank">Twitter</a>  
            <a href="https://instagram.com" target="_blank">Instagram</a>  
        </div>  
        <br>  
        <br>  
        <p>&copy; 2024 G MOTIONS. All rights reserved.</p>  
    </footer>  
</div>  

<script>  
    function togglePassword(fieldId) {  
        const field = document.getElementById(fieldId);  
        const type = field.getAttribute('type') === 'password' ? 'text' : 'password';  
        field.setAttribute('type', type);  
    }  
</script>  

<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-oBqDVmMz4fnFO9gybBogGzAIn7DaU4b8z+1kLx1KaBY6CBz1Ok2Whu9jjv6g2v6p" crossorigin="anonymous"></script>  
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-pzjw8f+ua7Kw1TIqPLTSXZXpN+aCuv3ZLDI+h5d7usBXfMuC5Lg5Oz6F/TQzns7M" crossorigin="anonymous"></script>  
</body>  
</html>
