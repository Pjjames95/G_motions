{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - G MOTIONS</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">

    <style>
        body {
            background-color: white; /* Consistent background */
            font-family: 'Roboto', sans-serif; /* Consistent font */
        }
        .login-container {
            max-width: 400px;
            margin: auto;
            padding: 30px;
            background: #fff; /* Background for the login container */
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1); /* Shadow effect for depth */
        }
        .login-container h2, h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #003366; /* Navy blue header */
        }
        .login-container label {
            font-weight: 500; /* Slightly bolder labels */
        }
        .login-container .btn-primary {
            background-color: #007bff; /* Bootstrap primary color */
            border: none; /* Remove border for consistency */
        }
        .login-container .btn-primary:hover {
            background-color: #0056b3; /* Darker blue on hover */
        }
        footer {
            background-color: #343a40; /* Darker footer */
            color: white;
            text-align: center;
            padding: 20px 0;
        }
        .social-links a {
            color: white; /* Social links color */
            margin: 0 10px;
            text-decoration: none;
        }
    </style>
</head>
<body style="background-color: #C0C0C0">
<div class="login-container">
    <h1>G MOTIONS</h1>
    <h2>Login</h2>
    <form method="post" action="{% url 'login' %}">
        {% csrf_token %}
        <div class="form-group mb-3">
            <label for="username">Username</label>
            <input type="text" class="form-control" id="username" name="username" required>
        </div>
        <div class="form-group mb-3">
            <label for="password">Password</label>
            <input type="password" class="form-control" id="password" name="password" required>
        </div>
        <button type="submit" class="btn btn-primary">Login</button>
    </form>
    <p class="mt-3 text-center">
        Don't have an account? <a href="{% url 'signup' %}">Sign up</a>
    </p>
    <p> Any query? Email us at:
        <a href="mailto:gmotions@gmail.com">gmotions@gmail.com</a>,
        <br>
        <a href="mailto:gmotionscommerce.org.com">gmotionscommerce.org.com</a>
    </p>
    <footer>
        <p>&copy; 2024 G MOTIONS. All rights reserved.</p>
        <div class="social-links">
            <a href="https://facebook.com" target="_blank">Facebook</a>
            <a href="https://twitter.com" target="_blank">Twitter</a>
            <a href="https://instagram.com" target="_blank">Instagram</a>
        </div>
    </footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
