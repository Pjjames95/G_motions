{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Profile - G MOTIONS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
        body {
            background-color: #C0C0C0; /* Light gray background */
            font-family: 'Roboto', sans-serif; /* Consistent font */
        }
        .container {
            max-width: 800px; /* Fixed max width for better layout */
            margin: auto;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1); /* Box shadow */
        }
        .card-header {
            background-color: #003366; /* Navy color for the header */
            color: white; /* White text for contrast */
        }
        .navbar {
            background-color: #003366; /* Navy blue */
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .navbar-brand, .nav-link {
            color: white !important;
        }
        .nav-link:hover {
            color: #FFD700 !important; /* Gold on hover */
        }
        .btn-primary {
            background-color: #007bff; /* Primary button color */
            border-color: #007bff; /* Border color */
        }
        .btn-danger {
            background-color: #dc3545; /* Danger button color */
            border-color: #dc3545; /* Border color */
        }
        .img-fluid {
            max-height: 200px; /* Constraint profile image height for uniformity */
        }
    </style>
</head>
<body>
<div class="container-fluid">
<header>
    <nav class="navbar navbar-expand-lg" style="font-size: 25px;">
        <div class="container">
            <a class="navbar-brand" href="#">G MOTIONS</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'home_view' %}">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'about' %}">About</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'products_listing' %}">Marketplace</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'cars_list' %}">Showroom</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'garage_list' %}">Garage</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
</header>
    <br>
    <br>
<div class="container" style="background-color: white">
    <div class="row justify-content-center mt-4">
        <div class="col-md-8 col-lg-6">
            <div class="card">
                <h3 class="card-header">Your Information</h3>
                <div class="card-body">
                    <p class="card-text"><strong>Username:</strong> {{ user.username }}</p>
                    <p class="card-text"><strong>Email:</strong> {{ user.email }}</p>
                    <p class="card-text"><strong>Bio:</strong> {{ user.bio }}</p>
                    {% if user.profile_image_url %}
                        <p><strong>Profile Image:</strong></p>
                        <img src="{{ user.profile_image_url }}" alt="{{ user.username }}'s profile image" class="img-fluid rounded">
                    {% endif %}
                    <a href="{% url 'profile_update' %}" class="btn btn-primary rounded">Update Profile</a>
                    <a href="{% url 'login' %}" class="btn btn-danger">Log out</a>
                </div>
            </div>
        </div>
    </div>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous"></script>
</body>
</html>
