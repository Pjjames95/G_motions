databases:
  - name: G_motionscommercedb
    plan: free
    databaseName: G_motionscommerce
    user: G_motionscommerce

services:
  - type: web
    plan: free
    name: G_motionscommerce
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "python -m gunicorn G_motionscommerce.asgi:application -k uvicorn.workers.UvicornWorker"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: G_motionscommercedb
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4