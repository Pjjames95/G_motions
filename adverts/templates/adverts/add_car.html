{% extends 'base.html' %}
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Car</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous">
{#    <link rel="stylesheet" href="{% static 'css/style.css' %}">#}
</head>
<body>
    <div class="container">
        <h1 class="my-4">Add a Car</h1>
        <form method="post" id="carForm">
            {% csrf_token %}
            <div class="mb-3">
                <label for="imageUrl" class="form-label">Image URL</label>
                <input type="url" class="form-control" id="imageUrl" name="imageUrl" placeholder="Enter image URL" required>
            </div>
            {{ form.as_p|slice:":[:-1]" }}  {# Adjust this if needed #}
            <button type="submit" class="btn btn-success">Add a Car</button>
        </form>
    </div>
    <script src="https://code.jquery.com/jquery-3.2.1.slim.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.11.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js"></script>
    <script>
        document.getElementById('carForm').onsubmit = function(event) {
            const imageUrl = document.getElementById('imageUrl').value;
            const pattern = new RegExp('^(https?:\\/\\/).+\\.(jpg|jpeg|png|gif)$', 'i');

            if (!pattern.test(imageUrl)) {
                alert('Please enter a valid image URL.');
                event.preventDefault(); // Prevent form submission
            }
        };
    </script>
</body>
</html>
