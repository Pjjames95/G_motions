{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Search Results</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
    <div class="container mt-4">
        <h1 class="my-4">Search Results</h1>
        <form method="GET" action="{% url 'search_car' %}" class="mb-4">
            <div class="form-group">
                <input type="text" name="query" class="form-control" placeholder="Search..." value="{{ request.GET.query }}" aria-label="Search for cars">
            </div>
            <button type="submit" class="btn btn-primary mt-2">Search</button>
        </form>
        <div class="row"> <!-- Use a Bootstrap grid system -->
            {% if results %}
                {% for result in results %}
                    <div class="col-md-4 mb-3"> <!-- Responsive column -->
                        <div class="card">
                            <img class="card-img-top" src="{{ result.car_image_url.url }}" alt="{{ result.car_name }}" style="height: 250px; object-fit: cover;">
                            <div class="card-body">
                                <h4 class="card-title">{{ result.car_name }}</h4>
                                <p class="card-text">{{ result.description }}</p>
                            </div>
                        </div>
                    </div>
                {% endfor %}
            {% else %}
                <div class="alert alert-warning" role="alert">No results found for "{{ request.GET.query }}". Please try a different search.</div> <!-- No results message -->
            {% endif %}
        </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script> <!-- Updated jQuery version -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script> <!-- Updated Popper.js -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script> <!-- Updated Bootstrap JS -->
</body>
</html>
