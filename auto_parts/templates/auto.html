{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}G MOTIONS{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
{#    <link rel="stylesheet" href="{% static 'css/style.css' %}">#}
    <style>
        .navbar {
            text-align: center;
            background-color: navy; /* Change background color for better visibility */
            padding: 20px;
            font-size: 30px;
        }
        .navbar-brand, .nav-link {
            font-size: 20px; /* Adjusted for better readability */
            color: white; /* Consistent text color */
        }
    </style>
</head>
<body style="background-color: #C0C0C0">
    <header>
    <nav class="navbar navbar-expand-lg" style="font-size: 25px; background-color: navy">
        <div class="container">
            <a class="navbar-brand" href="#">G motions</a>
            <a class="nav-link" href="{% url 'cart' %}" style="color:wheat">Cart</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'home_view' %}">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'about' %}">About</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'products_listing' %}">Marketplace</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'cars_list' %}">Showroom</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'garage_list' %}">Garage</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
</header>
<main>
    {% block content %}
    {% endblock %}
</main>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script> <!-- Updated to Bootstrap 5 compatible jQuery -->
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>  <!-- Updated Popper.js for Bootstrap 5 -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-oBqDVmMz4fnFO9gybBogGzAIn7DaU4b8z+1kLx1KaBY6CBz1Ok2Whu9jjv6g2v6p" crossorigin="anonymous"></script> <!-- Bootstrap 5 JS -->
</body>
</html>
